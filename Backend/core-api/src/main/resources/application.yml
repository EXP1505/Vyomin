spring:
  application:
    name: core-api
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://postgres:5432/vyomin_db}
    username: ${POSTGRES_USER:vyomin_admin}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
    neo4j:
      database: ${NEO4J_AURA_DATABASE}
  neo4j:
    uri: ${NEO4J_AURA_URI}
    authentication:
      username: ${NEO4J_AURA_USERNAME}
      password: ${NEO4J_AURA_PASSWORD}
    pool:
      # AuraDB caps concurrent connections well below the driver's own default (100) - keep the
      # local pool under that ceiling so we get a clean "wait for a slot" instead of AuraDB
      # resetting connections out from under us mid-query ("Failed to write messages").
      max-connection-pool-size: 20
      connection-acquisition-timeout: 30s
      max-connection-lifetime: 30m
      idle-time-before-connection-test: 30s
gdelt:
  # https, not http: GDELT 301-redirects every http:// request to https://, and Java's
  # HttpURLConnection (which our RestClient uses) refuses to auto-follow a redirect that changes
  # protocol - it silently returns the empty, zero-length 301 response instead, which is what
  # made every fetch here look like "the manifest/master list/CAMEO file was empty".
  manifest:
    url: ${GDELT_MANIFEST_URL:https://data.gdeltproject.org/gdeltv2/lastupdate.txt}
    master-list-url: ${GDELT_MASTER_LIST_URL:https://data.gdeltproject.org/gdeltv2/masterfilelist.txt}
  cameo:
    country:
      url: ${GDELT_CAMEO_COUNTRY_URL:https://data.gdeltproject.org/documentation/CAMEO.country.txt}
    type:
      url: ${GDELT_CAMEO_TYPE_URL:https://data.gdeltproject.org/documentation/CAMEO.type.txt}
    event:
      url: ${GDELT_CAMEO_EVENT_URL:https://data.gdeltproject.org/documentation/CAMEO.eventcodes.txt}
  conflict:
    # AuraDB free tier caps at 200,000 nodes total. 60 days' retention still left the graph at
    # 199,990/200,000 after a fresh prune - nowhere near enough headroom given live ingestion
    # runs every 15 minutes forever. Lowered further for real breathing room.
    retention-days: ${GDELT_CONFLICT_RETENTION_DAYS:21}
    # Live ingestion (isWhitelisted) previously had no severity gate at all - only "does either
    # actor's country appear in the ~150-country whitelist", which is nearly every country, so
    # ~70-75% of ALL global GDELT events passed every single cycle. This is what was actually
    # filling the graph, independent of retention. Matches the backfill path's own threshold
    # (min|goldstein| >= 5.0) so live ingestion only keeps events roughly as significant as what
    # the historical backfill considered worth keeping.
    min-severity-abs: ${GDELT_LIVE_MIN_SEVERITY_ABS:5.0}
api:
  finnhub:
    key: ${FINNHUB_API_KEY:}
  opensanctions:
    key: ${OPENSANCTIONS_API_KEY}
  opennetwork:
    clientId: ${Open_Network_clientId}
    clientSecret: ${Open_Network_clientSecret}
    tokenUrl: ${Open_Network_token_url}
    dataUrl: ${Open_Network_data_url}
app:
  admin:
    email: ${DEFAULT_ADMIN_EMAIL}
    password: ${DEFAULT_ADMIN_PASSWORD}
  jwt:
    secret: ${APP_JWT_SECRET:CHANGE_ME_IN_ENVIRONMENT}
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
vyomin:
  analysis:
    tickers: ${VYOMIN_ANALYSIS_TICKERS:LMT,RTX,NOC,GD,BA,XOM,CVX,USO,SPY}
    backfill:
      # Applied on top of GdeltIngestionService's live actor whitelist, on the raw -10..+10
      # Goldstein scale (not the 0-100 mapped severityScore) - the live whitelist alone runs
      # ~5-15k matching events/day, so a multi-month backfill needs a much tighter cut to stay a
      # reasonable Postgres table size.
      min-severity-abs: ${GDELT_BACKFILL_MIN_SEVERITY_ABS:5.0}
      # Per-worker pacing, not global: with `concurrency` workers each sleeping this long between
      # their own files, aggregate request rate is roughly concurrency / file-delay-ms.
      file-delay-ms: ${GDELT_BACKFILL_FILE_DELAY_MS:400}
      concurrency: ${GDELT_BACKFILL_CONCURRENCY:6}
      # Blank = default to the last 6 months ending today (see GdeltHistoricalBackfillService).
      start-date: ${GDELT_BACKFILL_START_DATE:}
      end-date: ${GDELT_BACKFILL_END_DATE:}
stooq:
  base-url: ${STOOQ_BASE_URL:https://stooq.com}
  backfill:
    ticker-delay-ms: ${STOOQ_TICKER_DELAY_MS:1500}
