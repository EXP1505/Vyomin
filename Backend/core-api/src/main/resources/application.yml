spring:
  application:
    name: core-api
  datasource:
    url: jdbc:postgresql://postgres:5432/vyomin_db
    username: ${POSTGRES_USER:vyomin_admin}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD:password}
  data:
    redis:
      host: redis
      port: 6379
api:
  finnhub:
    key: ${FINNHUB_API_KEY:}
  opensanctions:
    key: ${OPENSANCTIONS_API_KEY}
  opennetwork:
    clientId: ${Open_Network_clientId}
    clientSecret: ${Open_Network_clientSecret}
    tokenUrl: ${Open_Network_token_url}
    dataUrl: ${Open_Network_data_url}
app:
  admin:
    email: ${DEFAULT_ADMIN_EMAIL}
    password: ${DEFAULT_ADMIN_PASSWORD}
