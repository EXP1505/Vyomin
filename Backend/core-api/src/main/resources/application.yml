spring:
  application:
    name: core-api
  datasource:
    url: jdbc:postgresql://postgres:5432/vyomin_db
    username: ${POSTGRES_USER:vyomin_admin}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: redis
      port: 6379
api:
  finnhub:
    key: ${FINNHUB_API_KEY:}
  opensanctions:
    key: ${OPENSANCTIONS_API_KEY}
  opennetwork:
    clientId: ${Open_Network_clientId}
    clientSecret: ${Open_Network_clientSecret}
    tokenUrl: ${Open_Network_token_url}
    dataUrl: ${Open_Network_data_url}
app:
  admin:
    email: ${DEFAULT_ADMIN_EMAIL}
    password: ${DEFAULT_ADMIN_PASSWORD}
---
spring:
  config:
    activate:
      on-profile: dev
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}
---
spring:
  config:
    activate:
      on-profile: prod
  neo4j:
    uri: ${NEO4J_AURA_URI}
    authentication:
      username: ${NEO4J_AURA_USERNAME}
      password: ${NEO4J_AURA_PASSWORD}
