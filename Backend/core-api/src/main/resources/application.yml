spring:
  application:
    name: core-api
  datasource:
    url: jdbc:postgresql://postgres:5432/vyomin_db
    username: vyomin_admin
    password: vyomin_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: neo4j
      password: vyomin_graph_pass
  data:
    redis:
      host: redis
      port: 6379
api:
  finnhub:
    key: ${FINNHUB_API_KEY}
  opensanctions:
    key: ${OPENSANCTIONS_API_KEY}
app:
  admin:
    email: ${DEFAULT_ADMIN_EMAIL}
    password: ${DEFAULT_ADMIN_PASSWORD}
