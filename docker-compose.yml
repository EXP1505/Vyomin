
services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyomin_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vyomin_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  core-api:
    build:
      context: ./Backend/core-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - neo4j
      - redis
    env_file:
      - ./Backend/core-api/.env
    environment:
      - POSTGRES_URL=${DOCKER_POSTGRES_URL}
      - NEO4J_URI=${DOCKER_NEO4J_URI}
    restart: unless-stopped

  vyomin-web:
    build:
      context: ./vyomin-web
    ports:
      - "3000:80"
    depends_on:
      - core-api
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
