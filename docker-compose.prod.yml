
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  neo4j:
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  vyomin-web:
    ports:
      - "127.0.0.1:3000:80"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vyomin-web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
