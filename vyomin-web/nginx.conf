server {
    listen 80;
    server_name localhost;

    # Serve static React files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Support for React Router (Single Page Application)
        try_files $uri $uri/ /index.html;
    }

    # index.html references hashed asset filenames (index-<hash>.js/.css) that change on every
    # build - it must always be revalidated, otherwise the browser can cache a stale index.html
    # pointing at a JS bundle that no longer exists/was superseded, silently serving old code
    # after every deploy.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Reverse Proxy for REST API
    location /api/ {
        proxy_pass http://core-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's 60s default read timeout was firing on the event-study-sweep endpoint (a large
        # grid can legitimately run several minutes sequentially) - nginx would drop the client
        # connection and return 504 while the backend kept computing in the background, then hit a
        # "Broken pipe" trying to write the now-orphaned response. 300s covers a full 16-event-type
        # sweep against the default 14 pairs with headroom.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Reverse Proxy for WebSockets (STOMP over SockJS)
    location /ws-telemetry/ {
        proxy_pass http://core-api:8080/ws-telemetry/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400; # Keep WebSocket connection alive
    }
}
